
name: Test Horn African Daily Feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generator
        run: python generate_feed.py

      - name: Check generated RSS
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('docs/feed.xml').getroot(); assert r.tag == 'rss'; print('RSS XML is valid')"
